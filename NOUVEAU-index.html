<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Échecs</title>
<style>
:root{--bg:#e8ede2;--ink:#1f2a1a;--light:#eeeed2;--dark:#769656;--sel:#baca2b;--last:#cdd26a;--btn:#4f7a32;--btnink:#fff;--off:#c9d3bf;--card:#f5f8f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#262421;--ink:#f1efe9;--btn:#81b64c;--btnink:#10200a;--off:#3a3733;--card:#33302c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262421;--ink:#f1efe9;--btn:#81b64c;--btnink:#10200a;--off:#3a3733;--card:#33302c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 12px}
h1{margin:4px 0 0;font:700 2rem/1.1 Georgia,"Times New Roman",serif}
h2{margin:0;font-size:1.05rem}
.screen{display:none;flex-direction:column;align-items:center;gap:14px;width:100%}
.screen.show{display:flex}
.card{background:var(--card);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;width:min(94vw,420px);box-sizing:border-box}
input{font:inherit;padding:10px;border-radius:6px;border:2px solid var(--off);background:var(--bg);color:var(--ink);min-width:0}
#board{width:min(94vw,560px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:6px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;border:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq:focus-visible{outline:3px solid #ffd54a;outline-offset:-3px;z-index:1}
.sq img{width:86%;height:86%;object-fit:contain;pointer-events:none;user-select:none}
.l{background:var(--light)}.d{background:var(--dark)}.last{background:var(--last)}.sel{background:var(--sel)}
.dot::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(20,20,20,.35)}
.cap::after{content:"";position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(20,20,20,.4)}
#msg,#status,#who{font-weight:700;text-align:center;min-height:1.3em}
#who{font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.ctl{font:inherit;font-weight:700;border:0;border-radius:6px;padding:10px 16px;background:var(--off);color:var(--ink);cursor:pointer}
button.ctl.on,button.ctl.main{background:var(--btn);color:var(--btnink)}
button.ctl:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
#promo,#invite{display:none}#promo.show,#invite.show{display:flex}
table{border-collapse:collapse;width:min(94vw,520px)}td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--off)}
</style>
</head>
<body>
<h1>Échecs</h1>
<div id="msg" role="status" aria-live="polite"></div>

<section id="auth" class="screen"><div class="card">
  <h2>Connexion / inscription</h2>
  <input id="em" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="current-password">
  <input id="un" placeholder="Pseudo (inscription seulement)" maxlength="20">
  <div class="row"><button class="ctl main" id="b-login">Connexion</button><button class="ctl" id="b-signup">Créer un compte</button></div>
</div></section>

<section id="menu" class="screen">
  <div class="card" id="me"></div>
  <div class="card"><h2>Contre le bot</h2><div class="row" id="levels"></div><button class="ctl main" id="b-bot">Jouer</button></div>
  <div class="card"><h2>En ligne avec un ami</h2>
    <button class="ctl main" id="b-create">Créer une partie</button>
    <div class="row"><input id="code" placeholder="Code" maxlength="5" style="width:7em"><button class="ctl" id="b-join">Rejoindre</button></div></div>
  <div class="row"><button class="ctl" id="b-pvp">Deux joueurs</button><button class="ctl" id="b-lb">Classement</button><button class="ctl" id="b-out">Déconnexion</button></div>
</section>

<section id="game" class="screen">
  <div id="who"></div>
  <div id="board" role="grid" aria-label="Échiquier"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="invite" class="row"><button class="ctl main" id="b-copy">Copier le lien d’invitation</button></div>
  <div id="promo" class="row"><span>Promotion :</span>
    <button class="ctl" data-p="q">Dame</button><button class="ctl" data-p="r">Tour</button>
    <button class="ctl" data-p="b">Fou</button><button class="ctl" data-p="n">Cavalier</button></div>
  <div class="row"><button class="ctl" id="b-resign">Abandonner</button><button class="ctl" id="b-leave">Menu</button></div>
</section>

<section id="lb" class="screen"><h2>Classement</h2><div id="lbt"></div><button class="ctl" id="b-back">Retour</button></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>

async function setUser(u){
  me=u;
  if(!u){prof=null;show("auth");return}
  let {data}=await SB.from("profiles").select("*").eq("id",u.id).maybeSingle();
  if(!data){

  $("me").innerHTML=`<h2>Salut ${esc(prof.username)} !</h2><div>Elo bot : <b>${prof.elo_bot}</b> · Elo en ligne : <b>${prof.elo_online}</b><br>Victoires ${prof.wins} · Défaites ${prof.losses} · Nulles ${prof.draws}</div>`;
}
$("b-login").onclick=async()=>{
  msg("");const {data,error}=await SB.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error)return msg("Connexion impossible : "+error.message);
  setUser(data.user);
};
$("b-signup").onclick=async()=>{
  msg("");const un=$("un").value.trim();
  if(un.length<3)return msg("Choisis un pseudo de 3 caractères minimum.");
  const ex=await SB.from("profiles").select("id").eq("username",un).maybeSingle();
  if(ex.data)return msg("Ce pseudo est déjà pris.");
  const {data,error}=await SB.auth.signUp({email:$("em").value.trim(),password:$("pw").value,options:{data:{username:un}}});
  if(error)return msg("Inscription impossible : "+error.message);
  if(!data.session)return msg("Compte créé. Confirme ton e-mail, puis connecte-toi.");
  setUser(data.user);
};
$("b-out").onclick=async()=>{await SB.auth.signOut();setUser(null)};
async function record(field,oppElo,score){
  const old=prof[field],ne=elo(old,oppElo,score);
  const k=score===1?"wins":score===0?"losses":"draws";
  const upd={[field]:ne,[k]:prof[k]+1};
  const {error}=await SB.from("profiles").update(upd).eq("id",me.id);
  if(!error)Object.assign(prof,upd);
  return [old,ne];
}

/* ---------- plateau ---------- */
function render(){
  const b=$("board");b.innerHTML="";
  const R=flip?[1,2,3,4,5,6,7,8]:[8,7,6,5,4,3,2,1],F=flip?"hgfedcba":"abcdefgh";
  for(const r of R)for(const f of F){
    const sq=f+r,p=g.get(sq),el=document.createElement("button");
    el.className="sq "+(((r+"abcdefgh".indexOf(f))%2===1)?"l":"d");
    if(last.includes(sq))el.classList.add("last");
    if(sq===sel)el.classList.add("sel");
    if(targets.some(m=>m.to===sq))el.classList.add(p?"cap":"dot");
    if(p){const im=document.createElement("img");im.src=IMG[p.color+p.type];im.alt="";im.draggable=false;el.appendChild(im)}
    el.setAttribute("aria-label",sq);
    el.onclick=()=>click(sq);b.appendChild(el);
  }
  $("promo").classList.toggle("show",!!pending);
  $("invite").classList.toggle("show",mode==="online"&&online.status==="waiting");
  $("b-resign").style.display=mode==="online"&&online.status==="playing"&&!res?"":"none";
  $("who").textContent=mode==="bot"?`Toi (Blancs) contre le bot ${lv.n} (${lv.elo})`:
    mode==="online"?`Toi (${myColor==="w"?"Blancs":"Noirs"}) contre ${oppProf?oppProf.username+" ("+oppProf.elo_online+")":"…"}`:"Deux joueurs";
  let t;
  if(res)t=(res==="d"?"Partie nulle.":(res==="w"?"Les Blancs":"Les Noirs")+" gagnent."+(g.in_checkmate()?" Échec et mat !":""));
  else if(mode==="online"&&online.status==="waiting")t="En attente d’un ami… Code : "+online.code;
  else if(thinking)t="Le bot réfléchit…";
  else if(mode==="online")t=(g.turn()===myColor?"À toi de jouer":"Tour de l’adversaire")+(g.in_check()?" (échec)":"");
  else t=(g.in_check()?"Échec ! ":"")+"Tour des "+(g.turn()==="w"?"Blancs":"Noirs");
  $("status").textContent=t;
}
function canPlay(){
  if(res||thinking||pending)return false;
  if(mode==="bot")return g.turn()==="w";
  if(mode==="online")return online.status==="playing"&&g.turn()===myColor;
  return mode==="pvp";
}
function click(sq){
  if(!canPlay())return;
  if(sel){
    const ms=targets.filter(m=>m.to===sq);
    if(ms.length){if(ms[0].promotion&&ms.length>1){pending=ms;render();return}play(ms[0]);return}
  }
  const p=g.get(sq);
  if(p&&p.color===g.turn()){sel=sq;targets=g.moves({square:sq,verbose:true})}else{sel=null;targets=[]}
  render();
}
document.querySelectorAll("#promo [data-p]").forEach(b=>b.onclick=()=>{const m=pending.find(x=>x.promotion===b.dataset.p);if(m)play(m)});
function checkEnd(){
  if(g.game_over()&&!res){res=g.in_checkmate()?(g.turn()==="w"?"b":"w"):"d";return true}
  return false;
}
function play(m){
  g.move({from:m.from,to:m.to,promotion:m.promotion});
  last=[m.from,m.to];sel=null;targets=[];pending=null;
  const ended=checkEnd();
  if(mode==="online"){
    online.fen=g.fen();
    SB.from("games").update({fen:g.fen(),last_from:m.from,last_to:m.to,status:ended?"finished":"playing",result:ended?res:null}).eq("id",online.id).then(()=>{});
    render();if(ended)finishOnline();return;
  }
  if(mode==="bot"){
    render();if(ended)return endBot();
    if(g.turn()==="b"){thinking=true;render();setTimeout(botMove,60)}
    return;
  }
  render();
}

/* ---------- bot ---------- */
function evaluate(){let s=0;for(const row of g.board())for(const c of row)if(c)s+=(c.color==="w"?1:-1)*V[c.type];return s}
function minimax(d,a,b,max){
  if(g.in_checkmate())return (g.turn()==="b"?1:-1)*(100000+d);
  if(g.game_over())return 0;
  if(d===0)return evaluate();
  const ms=g.moves().sort((x,y)=>(y.includes("x")?1:0)-(x.includes("x")?1:0));
  let best=max?-Infinity:Infinity;
  for(const m of ms){
    g.move(m);const s=minimax(d-1,a,b,!max);g.undo();
    if(max){best=Math.max(best,s);a=Math.max(a,s)}else{best=Math.min(best,s);b=Math.min(b,s)}
    if(b<=a)break;
  }
  return best;
}
function botMove(){
  const moves=g.moves({verbose:true});
  let pick;
  if(Math.random()<lv.r)pick=moves[Math.floor(Math.random()*moves.length)];
  else{
    let bs=Infinity,bests=[];
    for(const m of moves){
      g.move({from:m.from,to:m.to,promotion:m.promotion});
      const s=minimax(lv.d-1,-Infinity,Infinity,true);g.undo();
      if(s<bs){bs=s;bests=[m]}else if(s===bs)bests.push(m);
    }
    pick=bests[Math.floor(Math.random()*bests.length)];
  }
  thinking=false;play(pick);
}
async function endBot(){
  const score=res==="d"?.5:res==="w"?1:0;
  const [o,n]=await record("elo_bot",lv.elo,score);
  msg(`Elo contre le bot : ${o} → ${n}`);render();
}

/* ---------- en ligne ---------- */
async function createGame(){
  const code=Math.random().toString(36).slice(2,7).toUpperCase();
  const {data,error}=await SB.from("games").insert({code,white:me.id}).select().single();
  if(error)return msg("Erreur : "+error.message);
  openOnline(data);
}
async function joinGame(code){
  code=code.trim().toUpperCase();
  const {data}=await SB.from("games").select("*").eq("code",code).maybeSingle();
  if(!data)return msg("Partie introuvable.");
  if(data.white===me.id||data.black===me.id)return openOnline(data);
  if(data.black)return msg("Cette partie est déjà complète.");
  const r=await SB.from("games").update({black:me.id,status:"playing"}).eq("id",data.id).is("black",null).select().single();
  if(r.error||!r.data)return msg("Impossible de rejoindre cette partie.");
  openOnline(r.data);
}
function openOnline(row){
  cleanup();msg("");
  mode="online";online=row;myColor=row.white===me.id?"w":"b";flip=myColor==="b";
  g=new Chess(row.fen);last=row.last_from?[row.last_from,row.last_to]:[];sel=null;targets=[];pending=null;thinking=false;
  res=row.status==="finished"?row.result:null;counted=!!res;oppProf=null;
  loadOpp();show("game");render();
  chan=SB.channel("g"+row.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"games",filter:"id=eq."+row.id},p=>onRemote(p.new)).subscribe();
  poll=setInterval(async()=>{const {data}=await SB.from("games").select("*").eq("id",row.id).single();if(data)onRemote(data)},3000);
}
async function loadOpp(){
  const id=myColor==="w"?online.black:online.white;if(!id)return;
  const {data}=await SB.from("profiles").select("*").eq("id",id).single();
  oppProf=data;render();
}
function onRemote(r){
  if(mode!=="online"||!online||r.id!==online.id)return;
  const wasWaiting=online.status==="waiting";
  if(ply(r.fen)>ply(g.fen())){g=new Chess(r.fen);last=[r.last_from,r.last_to];sel=null;targets=[]}
  online=Object.assign({},r,{fen:g.fen()});
  if(wasWaiting&&r.black&&!oppProf)loadOpp();
  if(r.status==="finished"&&!res){res=r.result;finishOnline()}
  render();
}
async function finishOnline(){
  if(counted)return;counted=true;
  const score=res==="d"?.5:(res===myColor?1:0);
  const [o,n]=await record("elo_online",oppProf?oppProf.elo_online:1200,score);
  msg(`Elo en ligne : ${o} → ${n}`);render();
}
$("b-resign").onclick=async()=>{
  if(mode!=="online"||res||online.status!=="playing")return;
  res=myColor==="w"?"b":"w";
  await SB.from("games").update({status:"finished",result:res}).eq("id",online.id);
  finishOnline();render();
};
$("b-copy").onclick=()=>{
  const url=location.origin+location.pathname+"?game="+online.code;
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>msg("Lien copié ! Envoie-le à ton ami."),()=>msg(url));
};

/* ---------- menu ---------- */
function cleanup(){if(chan){SB.removeChannel(chan);chan=null}if(poll){clearInterval(poll);poll=null}}
function startLocal(m){cleanup();msg("");mode=m;online=null;g=new Chess();sel=null;targets=[];last=[];pending=null;thinking=false;res=null;flip=false;show("game");render()}
$("b-bot").onclick=()=>startLocal("bot");
$("b-pvp").onclick=()=>startLocal("pvp");
$("b-create").onclick=createGame;
$("b-join").onclick=()=>{const c=$("code").value;if(c.trim().length>=3)joinGame(c)};
$("b-leave").onclick=()=>{cleanup();mode=null;menuHeader();show("menu")};
$("b-back").onclick=()=>show("menu");
$("b-lb").onclick=async()=>{
  const {data,error}=await SB.from("profiles").select("username,elo_online,elo_bot,wins,losses").order("elo_online",{ascending:false}).limit(20);
  if(error)return msg(error.message);
  $("lbt").innerHTML="<table><tr><th>#</th><th>Joueur</th><th>En ligne</th><th>Bot</th><th>V/D</th></tr>"+
    data.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.username)}</td><td>${p.elo_online}</td><td>${p.elo_bot}</td><td>${p.wins}/${p.losses}</td></tr>`).join("")+"</table>";
  show("lb");
};
LEVELS.forEach(l=>{
  const b=document.createElement("button");b.className="ctl"+(l===lv?" on":"");b.textContent=`${l.n} (${l.elo})`;
  b.onclick=()=>{lv=l;document.querySelectorAll("#levels .ctl").forEach(x=>x.classList.remove("on"));b.classList.add("on")};
  $("levels").appendChild(b);
});

(async()=>{
  const {data}=await SB.auth.getSession();
  setUser(data.session?data.session.user:null);
})();
</script>
